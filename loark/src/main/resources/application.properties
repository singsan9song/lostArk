spring.application.name=loark
logging.level.loark.application=OFF
server.port=${PORT:8081}
server.forward-headers-strategy=framework
lostark.api.base-url=${LOSTARK_API_BASE_URL:https://developer-lostark.game.onstove.com}
lostark.api.key=${LOSTARK_API_KEY:}
lostark.mari-shop.base-url=${LOSTARK_MARI_SHOP_BASE_URL:https://m-lostark.game.onstove.com}
lostark.mari-shop.cdn-base-url=${LOSTARK_CDN_BASE_URL:https://cdn-lostark.game.onstove.com/}
discord.cdn.avatar-base-url=${DISCORD_CDN_AVATAR_BASE_URL:https://cdn.discordapp.com/avatars/}
app.community.admin-discord-ids=${COMMUNITY_ADMIN_DISCORD_IDS:}
app.frontend-origin=${FRONTEND_ORIGIN:http://localhost:5173}
# ApiCacheState/PersistentApiCache가 쓰는 범용 API 캐시 TTL(초) — 이 시간 안에는
# 같은 요청이 와도 오픈API를 다시 안 부르고 캐시값을 그대로 씀
app.price-cache-ttl-seconds=${PRICE_CACHE_TTL_SECONDS:60}
# 거래소 가격을 다시 사용해도 되는 시간(초). 5초가 지나면 새 가격 갱신 대상이 됨
app.market-cache-ttl-seconds=${MARKET_CACHE_TTL_SECONDS:10}
# 이전에 조회한 거래소 아이템들을 다시 확인하는 주기(ms)
app.market-refresh-interval-ms=${MARKET_REFRESH_INTERVAL_MS:10000}
# 서버 실행 후 첫 거래소 자동 갱신까지 기다리는 시간(ms)
app.market-refresh-initial-delay-ms=${MARKET_REFRESH_INITIAL_DELAY_MS:10000}
# 거래소 오픈API 호출 시작 사이의 최소 간격(ms). 모든 병렬 작업에 공통 적용
app.market-refresh-min-interval-ms=${MARKET_REFRESH_MIN_INTERVAL_MS:10}
# 거래소 가격을 동시에 가져올 작업 수
app.market-refresh-concurrency=${MARKET_REFRESH_CONCURRENCY:20}
# 팔찌·어빌리티스톤 경매장 캐시 TTL(초, 공용). 1분 갱신 주기와 맞춰 실제 API도 매분 새로 조회
app.auction-cache-ttl-seconds=${AUCTION_CACHE_TTL_SECONDS:60}
# @Scheduled 작업이 팔찌·어빌리티 스톤·거래소를 서로 기다리지 않도록 실행할 스레드 수
app.scheduler-pool-size=${SCHEDULER_POOL_SIZE:5}
# 팔찌 시세를 추정할 때 경매장에서 샘플링할 최대 페이지 수
app.bracelet-sample-pages=${BRACELET_SAMPLE_PAGES:1000}
# 고대/유물 각각 한 번의 1분 작업에서 새로 받을 최대 페이지 수
app.bracelet-refresh-pages-per-run=${BRACELET_REFRESH_PAGES_PER_RUN:1000}
# 다른 기능이 사용할 수 있도록 이 횟수만큼 API remaining을 남기고 팔찌 수집을 멈춤
app.auction-rate-limit-reserve=${AUCTION_RATE_LIMIT_RESERVE:100}
# 팔찌 경매장 증분 갱신 주기(ms, 고대/유물 등급 공용) — fixedRate
app.auction-refresh-interval-ms=${AUCTION_REFRESH_INTERVAL_MS:60000}
# 고대 등급 팔찌 갱신의 최초 실행 대기 시간(ms) — 유물 등급과 시작 시각을
# 어긋나게 둬서 두 스케줄이 동시에 겹쳐 API를 한꺼번에 두 번 때리지 않게 함
app.bracelet-ancient-refresh-initial-delay-ms=${BRACELET_ANCIENT_REFRESH_INITIAL_DELAY_MS:15000}
# 유물 등급 팔찌 갱신의 최초 실행 대기 시간(ms) — 위 고대 등급과 어긋나게 배치
app.bracelet-relic-refresh-initial-delay-ms=${BRACELET_RELIC_REFRESH_INITIAL_DELAY_MS:90000}
# 어빌리티스톤 경매장 자동 갱신 반복 주기(ms) — fixedRate
app.ability-stone-refresh-interval-ms=${ABILITY_STONE_REFRESH_INTERVAL_MS:60000}
# 어빌리티스톤 경매장 자동 갱신의 최초 실행 대기 시간(ms)
app.ability-stone-refresh-initial-delay-ms=${ABILITY_STONE_REFRESH_INITIAL_DELAY_MS:5000}
# 목걸이·귀걸이·반지 경매장 자동 수집. false면 저장된 DB 조회와 수동 검색만 사용
app.accessory-auction-refresh.enabled=${ACCESSORY_AUCTION_REFRESH:true}
# 일반 악세 경매장 증분 수집 주기와 서버 시작 후 최초 실행 대기 시간(ms)
app.accessory-auction-refresh-interval-ms=${ACCESSORY_AUCTION_REFRESH_INTERVAL_MS:60000}
app.accessory-auction-refresh-initial-delay-ms=${ACCESSORY_AUCTION_REFRESH_INITIAL_DELAY_MS:45000}
# 한 번의 스케줄 실행에서 수집할 최대 페이지 수. API 잔여량이 먼저 부족하면 즉시 중단
app.accessory-auction-refresh-pages-per-run=${ACCESSORY_AUCTION_REFRESH_PAGES_PER_RUN:1000}
# kloa_characters.json 전체 캐릭터 일일 갱신. false면 서버가 작업을 시작하거나 재개하지 않음
app.character-daily-refresh.enabled=${CHARACTER_DAILY_REFRESH:true}
# API 한도에서 다른 기능을 위해 남겨 둘 요청 수
app.character-daily-refresh.rate-limit-reserve=${CHARACTER_DAILY_REFRESH_RATE_LIMIT_RESERVE:10}
# 한 번의 작업에서 연속 처리할 최대 캐릭터 수
app.character-daily-refresh.batch-size=${CHARACTER_DAILY_REFRESH_BATCH_SIZE:100}
# 작업 상태 확인 주기와 서버 시작 후 최초 확인 대기 시간(ms)
app.character-daily-refresh.poll-interval-ms=${CHARACTER_DAILY_REFRESH_POLL_INTERVAL_MS:1000}
app.character-daily-refresh.initial-delay-ms=${CHARACTER_DAILY_REFRESH_INITIAL_DELAY_MS:10000}
# 404를 제외한 캐릭터별 오류가 반복될 때 건너뛰기 전 재시도 횟수
app.character-daily-refresh.max-retries=${CHARACTER_DAILY_REFRESH_MAX_RETRIES:3}
# 기존 캐릭터 DB를 외부 API 호출 없이 랭킹용 컬럼으로 순차 보강
app.character-ranking.backfill-batch-size=${CHARACTER_RANKING_BACKFILL_BATCH_SIZE:250}
app.character-ranking.backfill-interval-ms=${CHARACTER_RANKING_BACKFILL_INTERVAL_MS:2000}
app.character-ranking.backfill-initial-delay-ms=${CHARACTER_RANKING_BACKFILL_INITIAL_DELAY_MS:5000}
app.mari-shop.enabled=${MARI_SHOP_ENABLED:true}
app.drop-legacy-tables=${DROP_LEGACY_TABLES:false}
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/loark-cache;AUTO_SERVER=TRUE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.security.oauth2.client.registration.discord.client-id=${DISCORD_CLIENT_ID:replace_me}
spring.security.oauth2.client.registration.discord.client-secret=${DISCORD_CLIENT_SECRET:replace_me}
spring.security.oauth2.client.registration.discord.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.discord.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.discord.scope=identify
spring.security.oauth2.client.provider.discord.authorization-uri=https://discord.com/oauth2/authorize
spring.security.oauth2.client.provider.discord.token-uri=https://discord.com/api/oauth2/token
spring.security.oauth2.client.provider.discord.user-info-uri=https://discord.com/api/users/@me
spring.security.oauth2.client.provider.discord.user-name-attribute=id
